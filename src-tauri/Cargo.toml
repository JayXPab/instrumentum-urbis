[package]
name = "instrumentum-urbis"
version = "0.1.0"
description = "Bulk generator of unique Minecraft building facades (desktop app)"
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "instrumentum_urbis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"

# Leave debugging details out of the libraries this app uses: they make the
# compiler need much more memory and disk, and we never debug those libraries.
[profile.dev.package."*"]
debug = false
