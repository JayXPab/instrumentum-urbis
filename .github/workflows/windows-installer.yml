# Builds the Windows installer on a GitHub Windows machine.
#
# - Pushing a tag like app-v1.1.0 builds it and puts the .exe on a new
#   GitHub release with that name (Releases page of the repository).
# - "Run workflow" on the Actions tab, or a pull request that changes the
#   desktop app, builds it too; the .exe is then a download on that run's page.
name: Windows installer

on:
  push:
    tags: ["app-v*"]
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # GitHub's machines have enough memory for more than the laptop's 2 jobs.
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Instrumentum Urbis ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/nsis/*.exe
